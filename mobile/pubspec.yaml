name: sylphplay_mobile
description: Sylphplay 手机版 — Ruanftrix
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 音频播放（音乐）
  just_audio: ^0.9.40
  # 视频播放
  video_player: ^2.9.2
  # 本地持久化（对应 localStorage：sylph:settings / sylph:queue / sylph:qview / sylph:qfilter / sylph:progress）
  shared_preferences: ^2.3.2
  # 文件 / 文件夹选择
  file_picker: ^13.1.0
  # 运行时权限（扫描本地媒体目录需要，Android 13+ 为 READ_MEDIA_*）
  permission_handler: ^11.3.1
  # 网络歌词（LRCLIB）
  http: ^1.2.2
  path: ^1.9.0
  # 歌词多为 GBK（酷我等下载源），Dart 无内置 GBK 解码，用它兜底
  fast_gbk: ^1.0.0
  # Font Awesome 图标（禁用 emoji）
  font_awesome_flutter: ^11.0.0
  provider: ^6.1.2
  # 后台播放 + 锁屏/通知栏/耳机按键控制（内部基于 audio_service）
  just_audio_background: ^0.0.1-beta.17
  # 配置音频会话：iOS 必须设为 playback 类别才允许后台音频
  audio_session: ^0.1.25

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png