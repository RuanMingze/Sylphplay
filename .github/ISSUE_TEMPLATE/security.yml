name: 安全漏洞报告
description: 提交安全相关问题，如文件读取越界、本地数据泄露等
title: "[Security] "
labels: ["security"]
assignees: ["RuanMingze"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🔒 安全漏洞报告
        如果是严重安全问题，建议先邮件沟通：**Sylphplay@ruanftrix.cn**
        本程序为本地播放器，不联网、不上传数据，主要关注本地文件访问权限相关问题。

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 高危（可读取/篡改任意本地文件）
        - 中危（特定条件下越权访问）
        - 低危（信息泄露影响有限）
        - 待定
    validations:
      required: true

  - type: textarea
    id: vuln_desc
    attributes:
      label: 漏洞描述
      description: 简述发现的安全问题
      placeholder: 例如：通过构造特殊路径，可让程序读取任意目录下的文件
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: 复现步骤
      description: 描述如何触发该问题
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 该漏洞可能造成什么后果
      placeholder: 例如：泄露用户本地文件内容
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows Electron桌面端
        - Android Flutter移动端
        - iOS Flutter移动端
        - Linux
        - macOS
        - 其他
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本号
      placeholder: 例如 v0.8.2
    validations:
      required: true

  - type: textarea
    id: reporter
    attributes:
      label: 报告人联系方式（可选）
      description: 方便后续确认修复进度
      placeholder: 邮箱或其他联系方式
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查项
      description: 请确认以下内容
      options:
        - label: 我已确认该问题未在公开 Issue 中报告过
        - label: 我理解公开 Issue 可能暴露漏洞细节，严重问题请优先邮件
    validations:
      required: true
