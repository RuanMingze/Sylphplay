name: Mobile · iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Stub signing team
        shell: bash
        run: |
          P="ios/Runner.xcodeproj/project.pbxproj"
          # 新版 Flutter/Xcode 强制要求 DEVELOPMENT_TEAM，即便 --no-codesign；
          # 仅在 CI 注入占位 Team，不影响本地开发。
          if ! grep -q 'DEVELOPMENT_TEAM' "$P"; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic;/&\n\t\t\t\tDEVELOPMENT_TEAM = S123456789;/g' "$P"
          fi

      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          rm -rf ../Payload
          mkdir -p ../Payload
          cp -R build/ios/iphoneos/Runner.app ../Payload/
          cd ..
          zip -qry "Sylphplay-${VERSION}-iOS.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylphplay-ios
          path: Sylphplay-*-iOS.ipa
          if-no-files-found: error