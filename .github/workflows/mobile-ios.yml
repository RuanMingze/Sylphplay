name: Mobile · iOS
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Stub signing team
        shell: bash
        run: |
          cat > /tmp/stub_team.py << 'PYEOF'
import re, sys
p = sys.argv[1]
s = open(p).read()
s2 = re.sub(
    r'(CODE_SIGN_STYLE = Automatic;)',
    r'\1\n\t\t\t\tDEVELOPMENT_TEAM = S123456789;',
    s,
)
open(p, 'w').write(s2)
print('injected DEVELOPMENT_TEAM')
PYEOF
          python3 /tmp/stub_team.py ios/Runner.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          rm -rf ../Payload
          mkdir -p ../Payload
          cp -R build/ios/iphoneos/Runner.app ../Payload/
          cd ..
          zip -qry "Sylphplay-${VERSION}-iOS.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylphplay-ios
          path: Sylphplay-*-iOS.ipa
          if-no-files-found: error
