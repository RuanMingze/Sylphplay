name: Mobile · iOS
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 导入仓库里预置的自签名证书（.github/certs/sylphplay-ci.p12），
      # 不动态生成，彻底绕开 runner 上 openssl pkcs12 的交互挂起问题
      - name: Import self-signed signing cert
        shell: bash
        run: |
          set -e
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          PASS='SylphplayCI'
          # 用绝对路径避免 runner bash 工作目录解析漂移
          CERT_PEM="$GITHUB_WORKSPACE/.github/certs/sylphplay-ci.cert.pem"
          P12="$GITHUB_WORKSPACE/.github/certs/sylphplay-ci.p12"
          test -f "$P12" || { echo "ERROR: p12 not found at $P12"; ls -la "$GITHUB_WORKSPACE/.github/certs/"; exit 1; }
          # 若 keychain 里已有同名证书（上轮 workflow 残留）则先删
          security find-certificate -a -c "Sylphplay CI AdHoc" -Z 2>/dev/null \
            | awk -F'"' '/SHA-1 hash/{print $2}' \
            | xargs -I{} security delete-certificate -Z {} 2>/dev/null || true
          security import "$P12" -P "$PASS" -A -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "" "$KEYCHAIN" 2>/dev/null || true
          security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN" "$CERT_PEM" 2>/dev/null || true
          echo "cert imported"

      - name: Stub signing team
        run: python3 stub_team.py ios/Runner.xcodeproj/project.pbxproj

      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          rm -rf ../Payload
          mkdir -p ../Payload
          cp -R build/ios/iphoneos/Runner.app ../Payload/
          cd ..
          zip -qry "Sylphplay-${VERSION}-iOS.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sylphplay-ios
          path: Sylphplay-*-iOS.ipa
          if-no-files-found: error
