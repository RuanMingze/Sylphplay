name: Desktop · macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS dmg (x64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build x64
        run: pnpm dist:mac --x64

      - name: Upload artifact x64
        uses: actions/upload-artifact@v4
        with:
          name: sylphplay-macos-x64
          path: dist/*macOS-x64*.dmg
          if-no-files-found: error

      - name: Build arm64
        run: pnpm dist:mac --arm64

      - name: Upload artifact arm64
        uses: actions/upload-artifact@v4
        with:
          name: sylphplay-macos-arm64
          path: dist/*macOS-arm64*.dmg
          if-no-files-found: error
